; PHP settings for PHP-FPM / CGI hosting (mod_php uses .htaccess instead).
display_errors = Off
session.use_strict_mode = 1
session.cookie_httponly = 1

; PHP2Shell (CVE-2026-109618 / CVE-2026-109619) workarounds.
; These only reduce the risk - upgrading PHP is the real fix.
session.upload_progress.enabled = 0
; PHP-FPM reports post_max_size but did not enforce it from this file in
; testing, so the web server's body limit (.htaccess or Nginx's
; client_max_body_size) is what actually stops large requests.
post_max_size = 1M
upload_max_filesize = 1M
