# Serves the application three ways and is driven by run.sh:
#   :8081  Apache + mod_php      (.htaccess sets the PHP options)
#   :8082  Apache + PHP-FPM      (.htaccess for Apache, .user.ini for PHP)
#   :8083  Nginx  + PHP-FPM      (deploy/nginx.conf, .user.ini for PHP)
# APP_DIR is a copy of the repository made by run.sh.

x-db-env: &db-env
  LIBRARY_DB_HOST: db
  LIBRARY_DB_USER: library
  LIBRARY_DB_PASSWORD: library-test

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root-test
      MARIADB_DATABASE: libraryrecords
      MARIADB_USER: library
      MARIADB_PASSWORD: library-test
    volumes:
      - ${APP_DIR}/database/libraryrecords.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60

  apache-modphp:
    build: { context: ., dockerfile: Dockerfile.php, args: { BASE: "php:8.3-apache" } }
    environment: *db-env
    volumes:
      - ${APP_DIR}:/var/www/html:ro
      - ./apache-modphp.conf:/etc/apache2/conf-enabled/zz-allow-override.conf:ro
    ports: ["8081:80"]
    depends_on: { db: { condition: service_healthy } }

  fpm:
    build: { context: ., dockerfile: Dockerfile.php, args: { BASE: "php:8.3-fpm" } }
    environment: *db-env
    volumes:
      - ${APP_DIR}:/var/www/html:ro
    depends_on: { db: { condition: service_healthy } }

  apache-fpm:
    image: httpd:2.4
    command: >
      sh -c "echo 'Include conf/extra/library.conf' >> conf/httpd.conf && httpd-foreground"
    volumes:
      - ${APP_DIR}:/var/www/html:ro
      - ./apache-fpm.conf:/usr/local/apache2/conf/extra/library.conf:ro
    ports: ["8082:80"]
    depends_on: [fpm]

  nginx-fpm:
    image: nginx:1.27
    command: >
      sh -c "sed -e 's#/var/www/library#/var/www/html#' -e 's#127.0.0.1:9000#fpm:9000#'
      /var/www/html/deploy/nginx.conf > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    volumes:
      - ${APP_DIR}:/var/www/html:ro
    ports: ["8083:80"]
    depends_on: [fpm]
