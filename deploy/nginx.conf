# Example Nginx server block for Library Records with PHP-FPM.
#
# Nginx ignores .htaccess, so these rules do the same job: they hide
# dot-folders (.git), the code-only folders and database dumps, and cap
# request bodies. PHP settings come from .user.ini, which PHP-FPM reads.
#
# Copy this file into your Nginx configuration (for example
# /etc/nginx/conf.d/library.conf) and change server_name, root and
# fastcgi_pass to match your server.

server {
    listen 80;
    server_name library.example.com;
    root /var/www/library;
    index index.php;

    # Reject oversized request bodies before PHP parses them.
    client_max_body_size 1m;

    # Hide PHP and Nginx version numbers.
    server_tokens off;
    fastcgi_hide_header X-Powered-By;

    # Dot-folders and dotfiles (.git, .htaccess, .user.ini), except ACME.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Code-only folders and deploy files.
    location ~ ^/(includes|lang|database|deploy|tests)(/|$) {
        return 404;
    }

    location ~ \.(sql|md|ini|log|yml|yaml|sh|conf)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }
}
