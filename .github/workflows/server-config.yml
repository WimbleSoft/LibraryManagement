name: Server configuration

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: find . -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l

  servers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check .htaccess, .user.ini and deploy/nginx.conf on Apache, PHP-FPM and Nginx
        run: tests/server/run.sh

  lending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the lending rules end to end
        run: tests/app/run.sh
